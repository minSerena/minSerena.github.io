bio: 'I am a **Ph.D. student in the Department of Biological Sciences at Wayne State University**, advised
  by **Prof. Chuanzhu Fan**. My doctoral research investigates the molecular mechanisms of **sex determination
  in spinach**, using comparative genomics, transcriptomics, and functional gene characterization.


  I received my M.S. from Shanghai Ocean University in 2024, where I worked with **Prof. Peimin He** on
  plant stress responses and coastal ecological restoration, and my B.S. from Binzhou University in 2021.
  My research includes genomic and transcriptomic profiling of *Suaeda salsa* across salinity gradients,
  betacyanin-mediated photosynthetic protection, and coastal wetland restoration.


  Alongside my research, I serve as a **Graduate Teaching Assistant** at Wayne State University, teaching
  Genetics and Principles of Microbiology Lab.'
