bio: |-
  I am a Ph.D. student in Biological Sciences at Wayne State University. My current research integrates comparative genomics, transcriptomics, and functional gene characterization to investigate the genetic and molecular mechanisms of sex determination in spinach and how these mechanisms have evolved.

  I received my M.S. from Shanghai Ocean University, where I investigated the mechanisms underlying betacyanin-associated color changes in *Suaeda salsa*. I also contributed to coastal wetland restoration, which shaped my interest in how organisms respond to environmental change.

  Building on these experiences, my broader research interests lie at the intersection of ecology and evolution. I aim to understand how molecular mechanisms, phenotypic plasticity, and evolutionary adaptation shape organismal responses to changing environments.

  I welcome opportunities to connect with others working in genomics, evolutionary biology, and ecology, so please feel free to reach out.
