bio: 'I am a Ph.D. student in the Department of Biological Sciences at Wayne State University, advised
  by Prof. Chuanzhu Fan. My research investigates the genetic and molecular mechanisms of sex determination
  in plants. Using comparative genomics, transcriptomics, and functional gene characterization, I study
  sex determination and its evolution in spinach, a predominantly dioecious crop.


  My previous research focused on environmental stress responses in the coastal halophyte *Suaeda salsa*,
  including genomic and transcriptomic analyses of salinity responses, temperature-dependent betacyanin
  biosynthesis, and the role of betacyanins in photosynthetic protection under salt stress. During my
  M.S. at Shanghai Ocean University, advised by Prof. Peimin He, I also contributed to coastal wetland
  restoration projects through field sampling, laboratory experiments, and data analysis.


  Alongside my research, I serve as a Graduate Teaching Assistant at Wayne State University, supporting
  instruction in Genetics and Principles of Microbiology Lab, and received a Graduate Teaching Assistant
  Award in 2026.'
