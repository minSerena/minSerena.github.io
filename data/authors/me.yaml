bio: 'I am a Ph.D. student in the Department of Biological Sciences at Wayne State University, advised
  by Prof. Chuanzhu Fan. My doctoral research investigates the evolution and molecular regulatory mechanisms
  of sex determination in spinach through comparative genomics, transcriptomics, and functional gene characterization.


  I earned my M.S. from Shanghai Ocean University in 2024, advised by Prof. Peimin He, and my B.S. from
  Shandong University of Aeronautics in 2021, advised by Prof. Jingkuan Sun. My research has focused on
  plant stress responses and coastal wetland restoration, including genomic and transcriptomic profiling
  of *Suaeda salsa* across salinity gradients and studies of the role of betacyanins in photosynthetic
  protection.


  Alongside my research, I serve as a Graduate Teaching Assistant at Wayne State University, teaching
  Genetics and Principles of Microbiology Lab.'
