bio: 'My research focuses on **plant physiology and coastal wetland ecology**, with a particular interest
  in *Suaeda salsa*, betacyanin synthesis, and plant responses to environmental stress.


  My graduate research at Shanghai Ocean University, advised by Prof. Peimin He, explored the mechanism
  of color change in *Suaeda salsa*. My undergraduate training in ecology at Binzhou University was supervised
  by Prof. Jingkuan Sun.


  I have contributed to research on coastal wetland restoration, mudflat plant stress tolerance, and water
  environment improvement in river–sea transition areas. My work includes first-author publications on
  betacyanin synthesis and its regulation.'
