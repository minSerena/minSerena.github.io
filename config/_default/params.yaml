hugoblox:
  schema: '2.0'
  identity:
    name: Min Li
    type: person
    tagline: Ph.D. Student | Wayne State University
    description: 'Min Li''s academic homepage at Wayne State University: spinach sex determination, comparative
      genomics, transcriptomics, Suaeda salsa, and plant stress responses.'
  theme:
    mode: system
    pack: default
    # Muted academic purple. A hex value becomes the 500 shade; the theme derives
    # 50-950 by mixing with white/black. Secondary is a soft plum for gradients.
    colors:
      primary: '#7c6aae'
      secondary: '#9a6f9e'
      neutral: ''
  typography:
    font: serif
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
