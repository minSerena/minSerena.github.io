{{/*
  Scroll-reveal for landing-page sections.

  Progressive enhancement: the `reveal` class (which sets opacity:0) is added by
  this script, so if JS is disabled or IntersectionObserver is missing, nothing
  is ever hidden. Honours prefers-reduced-motion by opting out entirely.
*/}}
<script>
  (function () {
    if (!('IntersectionObserver' in window)) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    document.addEventListener('DOMContentLoaded', function () {
      var sections = document.querySelectorAll('.hbb-section');
      if (!sections.length) return;

      var observer = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { rootMargin: '0px 0px -10% 0px', threshold: 0.05 }
      );

      sections.forEach(function (section, i) {
        // Leave the hero visible: animating it causes a flash on first paint.
        if (i === 0) return;
        section.classList.add('reveal');
        observer.observe(section);
      });
    });
  })();
</script>
